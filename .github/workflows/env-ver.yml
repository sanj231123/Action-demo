name: env variable demo

on:
  push:

env:                      # Workflow-level
  APP_ENV: "dev"

jobs:
  env-for-demo:
    runs-on: ubuntu-latest

    env:                  # Job-level
      APP_ENV: "stage"

    steps:
      - name: Env demo step
        env:              # Step-level
          APP_ENV: "prod"
        run: |
          echo "Shell access: $APP_ENV"
          echo "GitHub expression access: ${{ env.APP_ENV }}"
